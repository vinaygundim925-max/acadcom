
      - name: Check Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -eu

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Required GitHub Actions secrets are missing."
            exit 1
          fi

          status=$(curl -sS \
            -o /tmp/supabase-response.json \
            -w "%{http_code}" \
            --max-time 30 \
            "$SUPABASE_URL/auth/v1/health" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")

          echo "Supabase Auth health endpoint HTTP status: $status"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Supabase health check failed."
            exit 1
          fi

          echo "Supabase Auth health endpoint responded successfully."
